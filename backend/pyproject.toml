[project]
name = "keep-rollin-backend"
version = "0.1.0"
description = "Keep Rollin API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.12,<4",
  "alembic>=1.14.0",
  "apscheduler>=3.11.1,<4",
  "argon2-cffi>=23.1.0",
  "asyncpg>=0.30.0",
  "boto3>=1.40.0",
  "cryptography>=43.0.0",
  "fastapi>=0.165.0",
  "greenlet>=3.1.0",
  "jinja2>=3.1.6,<4",
  "pillow>=12.2.0",
  "prometheus-client>=0.21.0,<1",
  "pydantic-settings>=2.6.0",
  "py-vapid>=1.9,<2",
  "pyjwt>=2.10.0",
  "pypdf>=6.21.4",
  "python-multipart>=0.0.28",
  "pywebpush>=2.5,<3",
  "sentry-sdk>=2.0,<3",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.32.0",
  "yarl>=1.9,<2",
]

[project.optional-dependencies]
dev = [
  "asyncpg-stubs>=0.32.0",
  "boto3-stubs[s3]>=1.40.0",
  "certifi>=2024.0.0",
  "httpx>=0.28.0",
  "mypy>=1.13.0",
  "polyfactory>=2.18.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["httpx", "httpx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
data_file = "../.coverage"

[dependency-groups]
dev = [
    "types-pyjwt>=1.7.1",
]
