# Keep Rollin Nuxt SSR. Image is built and pushed by deploy/deploy.sh (or CI);
# the tag is set with `kubectl set image`, so keep `:rolling` here only as a
# valid placeholder.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: keep-rollin
data:
  # Same-origin /api/** calls are proxied here once a backend exists,
  # e.g. http://backend:8000. Empty means no proxy (Nuxt returns 404).
  NUXT_API_PROXY_TARGET: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: keep-rollin
  labels:
    app: web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: web-config
          env:
            # Node sizes its heap from the cgroup limit; SSR + PrimeVue needs
            # well over the ~256 MiB default that a small limit implies.
            - name: NODE_OPTIONS
              value: --max-old-space-size=768
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: keep-rollin
  labels:
    app: web
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
